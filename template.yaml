AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  suptech-supervisory-prompts

  Sample SAM Template for suptech-supervisory-records

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 60
  Api:
    Cors:
      AllowMethods: "'*'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"

Parameters:
  PromptsTableName:
    Type: String
    Default: table
  BedrockModelId:
    Type: String
    Default: model
  RecordsBucketName:
    Type: String
    Default: bucket
  CsvAnalysisBucketName:
    Type: String
    Default: bucket
  SupervisoryRecordsTableName:
    Type: String
    Default: table
  SupervisoryRecordsStreamArn:
    Type: String
    Default: stream
  InteractionWebSocketQueueUrl:
    Type: String
    Default: queue
  StageName:
    Type: String
    Default: develop
  SaveCSVFlag:
    Type: String
    Default: "false"
  PdfJsLayer:
    Type: String
    Default: layer

Resources:
  CsvBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref CsvAnalysisBucketName

  RegulatoryComplianceIntelligenceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      OpenApiVersion: 3.0.1
      DefinitionBody: # an OpenApi definition
        Fn::Transform:
          Name: "AWS::Include"
          Parameters:
            Location: "infrastructure/openapi.yml"
      EndpointConfiguration:
        Type: REGIONAL
      BinaryMediaTypes:
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/pdf"

  RegulatoryCompliancePromptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PromptsTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: version
          AttributeType: N
        - AttributeName: application
          AttributeType: S
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: application-type-index
          KeySchema:
            - AttributeName: application
              KeyType: HASH
            - AttributeName: type
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1


  GetDocumentsAnalysisSheetFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: functions/get-documents-analysis-sheet/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 60
      Architectures:
        - x86_64
      Role: !GetAtt GetDocumentsAnalysisSheetFunctionRole.Arn
      Environment:
        Variables:
          S3_CSV_BUCKET_NAME: !Ref CsvAnalysisBucketName
      Events:
        GetDocumentAnalysisSheetApi:
          Type: Api
          Properties:
            Path: /regulatory-compliance-intelligence/documents-analysis-sheet/{uuid}
            Method: GET
            RestApiId: !Ref RegulatoryComplianceIntelligenceApi
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  DocumentHighlightFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/document-highlight/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 120
      Architectures:
        - x86_64
      Role: !GetAtt DocumentHighlightFunctionRole.Arn
      Environment:
        Variables:
          S3_RECORDS_BUCKET_NAME: !Ref RecordsBucketName
          S3_CSV_ANALYSIS_BUCKET_NAME: !Ref CsvAnalysisBucketName
          SUPERVISORY_RECORDS_TABLE_NAME: !Ref SupervisoryRecordsTableName
      Events:
        DocumentHighlightApi:
          Type: Api
          Properties:
            Path: /regulatory-compliance-intelligence/pdf/highlight/{messageId}/{recordKey}
            Method: GET
            RestApiId: !Ref RegulatoryComplianceIntelligenceApi
      Layers:
        - !Ref PdfJsLayer
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        External:
          - pdfjs-dist
        EntryPoints:
          - app.ts

  RegulatoryCompliancePromptFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: functions/regulatory-compliance-prompt/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 60
      Architectures:
        - x86_64
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
          AllowOrigins:
            - "*"
      Role: !GetAtt RegulatoryCompliancePromptFunctionRole.Arn
      Environment:
        Variables:
          SYSTEM_PROMPTS_TABLE_NAME: !Ref PromptsTableName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          S3_DOCUMENTS_BUCKET_NAME: !Ref RecordsBucketName
          S3_CSV_BUCKET_NAME: !Ref CsvAnalysisBucketName
          SAVE_CSV_FLAG: !Ref SaveCSVFlag
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  MetadataInsertionPromptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/metadata-insertion/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 60
      Architectures:
        - x86_64
      Role: !GetAtt MetadataInsertionPromptFunctionRole.Arn
      Environment:
        Variables:
          SUPERVISORY_RECORDS_TABLE_NAME: !Ref SupervisoryRecordsTableName
          S3_DOCUMENTS_BUCKET_NAME: !Ref RecordsBucketName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          INTERACTION_WEBSOCKET_QUEUE_URL: !Ref InteractionWebSocketQueueUrl
      Events:
        DynamoDBTrigger:
          Type: DynamoDB
          Properties:
            Stream: !Ref SupervisoryRecordsStreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  RegulatoryCompliancePromptFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  DocumentHighlightFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  MetadataInsertionPromptFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess

  GetDocumentsAnalysisSheetFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
