AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  suptech-supervisory-prompts

  Sample SAM Template for suptech-supervisory-records

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 60
  Api:
    Cors:
      AllowMethods: "'*'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"

Parameters:
  PromptsTableName:
    Type: String
    Default: table
  WarrantyAnalysisTableName:
    Type: String
    Default: table
  LetterAnalysisTableName:
    Type: String
    Default: table
  BedrockModelId:
    Type: String
    Default: model
  WarrantyReportsBucketName:
    Type: String
    Default: bucket
  LetterReportsBucketName:
    Type: String
    Default: bucket
  RecordsBucketName:
    Type: String
    Default: bucket
  CsvAnalysisBucketName:
    Type: String
    Default: bucket
  ProcessedRecordsBucketName:
    Type: String
    Default: bucket
  SupervisoryRecordsTableName:
    Type: String
    Default: table
  SupervisoryRecordsMetadataTableName:
    Type: String
    Default: table
  SupervisoryRecordsStreamArn:
    Type: String
    Default: stream
  InteractionWebSocketQueueUrl:
    Type: String
    Default: queue
  StageName:
    Type: String
    Default: develop
  SaveCSVFlag:
    Type: String
    Default: "true"
  PdfJsLayer:
    Type: String
    Default: layer
  MetadataExtractionServiceUrl:
    Type: String
    Default: url
  KafkaBrokers:
    Type: String
    Default: brokers
  WarrantyRRTableName:
    Type: String
    Default: table
  WarrantyITTableName:
    Type: String
    Default: table
  LetterRRTableName:
    Type: String
    Default: table
  LetterITTableName:
    Type: String
    Default: table
  SubordinatedDebtCriteriaTableName:
    Type: String
    Default: table

Resources:
  CsvBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref CsvAnalysisBucketName
  ProcessedRecordsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ProcessedRecordsBucketName

  RegulatoryComplianceIntelligenceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      OpenApiVersion: 3.0.1
      DefinitionBody: # an OpenApi definition
        Fn::Transform:
          Name: "AWS::Include"
          Parameters:
            Location: "infrastructure/openapi.yml"
      EndpointConfiguration:
        Type: REGIONAL
      BinaryMediaTypes:
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "application/pdf"

  RegulatoryCompliancePromptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PromptsTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: version
          AttributeType: N
        - AttributeName: application
          AttributeType: S
        - AttributeName: documentType
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: application-documentType-index
          KeySchema:
            - AttributeName: application
              KeyType: HASH
            - AttributeName: documentType
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # NOTE: WARRANTY and LETTER DynamoDB tables already exist in QA AWS environment
  # These tables are currently managed by CloudFormation in the QA stack
  # They were intentionally left out of this template to avoid GSI update conflicts
  # The tables will continue to exist and be used by the Lambda functions via table name parameters

  SubordinatedDebtCriteriaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SubordinatedDebtCriteriaTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: tipo
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: tipo
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Purpose
          Value: SubordinatedDebtComplianceCriteria
        - Key: Source
          Value: BasileaIII-SBS-3950-2022

  GetDocumentsAnalysisSheetFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: functions/get-documents-analysis-sheet/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 60
      Architectures:
        - x86_64
      Role: !GetAtt GetDocumentsAnalysisSheetFunctionRole.Arn
      Environment:
        Variables:
          S3_CSV_BUCKET_NAME: !Ref CsvAnalysisBucketName
          S3_PROCESSED_DOCUMENTS_BUCKET_NAME: !Ref ProcessedRecordsBucketName
      Events:
        GetDocumentAnalysisSheetApi:
          Type: Api
          Properties:
            Path: /regulatory-compliance-intelligence/documents-analysis-sheet/{uuid}
            Method: GET
            RestApiId: !Ref RegulatoryComplianceIntelligenceApi
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  DocumentHighlightFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/document-highlight/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 120
      Architectures:
        - x86_64
      Role: !GetAtt DocumentHighlightFunctionRole.Arn
      Environment:
        Variables:
          S3_RECORDS_BUCKET_NAME: !Ref RecordsBucketName
          S3_CSV_ANALYSIS_BUCKET_NAME: !Ref CsvAnalysisBucketName
          SUPERVISORY_RECORDS_TABLE_NAME: !Ref SupervisoryRecordsTableName
      Events:
        DocumentHighlightApi:
          Type: Api
          Properties:
            Path: /regulatory-compliance-intelligence/pdf/highlight/{messageId}/{recordKey}
            Method: GET
            RestApiId: !Ref RegulatoryComplianceIntelligenceApi
      Layers:
        - !Ref PdfJsLayer
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        External:
          - pdfjs-dist
        EntryPoints:
          - app.ts

  RegulatoryCompliancePromptFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: functions/regulatory-compliance-prompt/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 60
      Architectures:
        - x86_64
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
          AllowOrigins:
            - "*"
      Role: !GetAtt RegulatoryCompliancePromptFunctionRole.Arn
      Environment:
        Variables:
          SYSTEM_PROMPTS_TABLE_NAME: !Ref PromptsTableName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          S3_DOCUMENTS_BUCKET_NAME: !Ref RecordsBucketName
          S3_CSV_BUCKET_NAME: !Ref CsvAnalysisBucketName
          S3_PROCESSED_DOCUMENTS_BUCKET_NAME: !Ref ProcessedRecordsBucketName
          S3_WARRANTY_REPORTS_BUCKET_NAME: !Ref WarrantyReportsBucketName
          S3_LETTER_REPORTS_BUCKET_NAME: !Ref LetterReportsBucketName
          WARRANTY_ANALYSIS_TABLE_NAME: !Ref WarrantyAnalysisTableName
          LETTER_ANALYSIS_TABLE_NAME: !Ref LetterAnalysisTableName
          SUBORDINATED_DEBT_ANALYSIS_TABLE_NAME: "subordinated-debt-analysis"
          SUPERVISORY_RECORDS_TABLE_NAME: !Ref SupervisoryRecordsTableName
          SAVE_CSV_FLAG: !Ref SaveCSVFlag
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  ProcessDocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.us-east-1.amazonaws.com/suptechregulatorycompliancepromptdf6aa69a/processdocumentsfunctioncdc0a880repo@sha256:9fa6c298889ae27b55cebcd4e80fa3f7d04da311a40100e36cfe2e5bced25fa4"
      MemorySize: 1024
      Timeout: 180
      Architectures:
        - x86_64
      Role: !GetAtt ProcessDocumentsFunctionRole.Arn
      Environment:
        Variables:
          SUPERVISORY_RECORDS_TABLE_NAME: !Ref SupervisoryRecordsTableName
          SUPERVISORY_RECORDS_METADATA_TABLE_NAME: !Ref SupervisoryRecordsMetadataTableName
          SYSTEM_PROMPTS_TABLE_NAME: !Ref PromptsTableName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          S3_DOCUMENTS_BUCKET_NAME: !Ref RecordsBucketName
          S3_PROCESSED_DOCUMENTS_BUCKET_NAME: !Ref ProcessedRecordsBucketName
          KAFKA_BROKERS: !Ref KafkaBrokers
          NODE_OPTIONS: "--enable-source-maps"
          INTERACTION_WEBSOCKET_QUEUE_URL: !Ref InteractionWebSocketQueueUrl
          HOME: "/tmp"
          SUBORDINATED_DEBT_CRITERIA_TABLE_NAME: "SubordinatedDebtCriteriaTable"
          SUBORDINATED_DEBT_ANALYSIS_TABLE_NAME: "subordinated-debt-analysis"
      Events:
        DynamoDBTrigger:
          Type: DynamoDB
          Properties:
            Stream: !Ref SupervisoryRecordsStreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'
    # Metadata removed - using existing ECR image directly, no rebuild needed

  ProcessCsvDocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/process-csv-documents/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 900
      Architectures:
        - x86_64
      Role: !GetAtt ProcessCsvDocumentsFunctionRole.Arn
      Environment:
        Variables:
          S3_DOCUMENTS_BUCKET_NAME: !Ref RecordsBucketName
          WARRANTY_RR_TABLE: !Ref WarrantyRRTableName
          WARRANTY_IT_TABLE: !Ref WarrantyITTableName
          LETTER_RR_TABLE: !Ref LetterRRTableName
          LETTER_IT_TABLE: !Ref LetterITTableName
          NODE_OPTIONS: "--enable-source-maps"
          INTERACTION_WEBSOCKET_QUEUE_URL: !Ref InteractionWebSocketQueueUrl
      Events:
        DynamoDBTrigger:
          Type: DynamoDB
          Properties:
            Stream: !Ref SupervisoryRecordsStreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  GenerateWarrantyDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/generate-warranty-document/
      Handler: app.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 30
      Architectures:
        - x86_64
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
          AllowOrigins:
            - "*"
      Environment:
        Variables:
          NODE_OPTIONS: "--enable-source-maps"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

  RegulatoryCompliancePromptFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  DocumentHighlightFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  ProcessDocumentsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess

  ProcessCsvDocumentsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess

  GetDocumentsAnalysisSheetFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
